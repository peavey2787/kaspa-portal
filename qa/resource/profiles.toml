schema = 1

# Quick gates are intended for every release E2E run. Soak gates deliberately
# run longer and use slope/plateau checks rather than demanding zero allocator
# growth, which would be both unrealistic and flaky across operating systems.

[[profile]]
name = "standard"
native_scenario = "standard"
browser_scenario = "browser_standard_resources"
quick_warmup = 20
quick_batches = 6
quick_iterations_per_batch = 40
soak_warmup = 100
soak_batches = 24
soak_iterations_per_batch = 200
max_rss_growth_bytes = 67108864
max_rss_slope_bytes_per_batch = 4194304
max_idle_cpu_ratio = 0.10
max_thread_growth = 4
max_handle_or_fd_growth = 16
max_browser_heap_growth_bytes = 16777216
max_browser_heap_slope_bytes_per_batch = 2097152
max_browser_backing_growth_bytes = 33554432
max_browser_backing_slope_bytes_per_batch = 4194304
max_browser_dom_growth = 8

